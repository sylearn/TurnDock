name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    # 内核与命令行不依赖 macOS；桌面外壳需要 WebKit，只在发布时于 macOS 构建。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 工具链
        run: rustup show active-toolchain || rustup toolchain install
      - name: 格式
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude turndock-desktop --all-targets --locked -- -D warnings
      - name: 测试
        run: cargo test --workspace --exclude turndock-desktop --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
