[package]
name = "turndock-desktop"
description = "回合（TurnDock）桌面应用"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "turndock_desktop"
crate-type = ["rlib"]

[[bin]]
name = "turndock-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
turndock-core.workspace = true
turndock-broker.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "zip"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
